version = 2

[global]
dll = "/mnt/windows/Games/Steam/steamapps/common/Lossless Scaling/Lossless.dll"
allow_fp16 = true

[[profile]]
name = "app-oneway"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# The working launch (wiki config/lsfg-vk-kennykiller.md, 2026-09-10 verified
# RE2 662 presents/s) used transport = "udmabuf" here. The profile dropped it.
transport = "udmabuf_ring"
ring_slots = 3

[[profile]]
name = "re2-oneway"
active_in = [
  "RESIDENT EVIL 2  BIOHAZARD RE2/re2.exe",
  "RESIDENT EVIL 2  BIOHAZARD RE2\\re2.exe",
]
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# ring: the layer sends the ring fds, the app imports them and maps the
# control block, and no card imports via a dma-buf path beyond the ring.
# MUST match app-oneway: a per-side mismatch kills every handshake.
transport = "udmabuf_ring"
ring_slots = 3
