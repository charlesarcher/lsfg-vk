version = 2

# A/B against furmark-decoupled.toml, which despite its name runs transport =
# "udmabuf" (the bounce). Bounce measured 2026-10-11 at 1440p MSAA 4: game side
# 127.78 presents/s (FurMark 124/128/134 fps) but the doubler presented only
# 25.1/s on a 239.88 Hz panel, p99 tick gap ~40 ms.
# Bounce run: /tmp/lsfg-runs/furmark-decoupled-bench/20261011T183744

[global]
dll = "/mnt/windows/Games/Steam/steamapps/common/Lossless Scaling/Lossless.dll"
allow_fp16 = true

[[profile]]
name = "app-oneway"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
transport = "decoupled"
output = "DP-7"
hud = true

[[profile]]
name = "furmark-oneway"
active_in = "furmark"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
transport = "decoupled"
output = "DP-7"
hud = true
