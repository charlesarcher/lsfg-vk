version = 2

[global]
dll = "/mnt/windows/Games/Steam/steamapps/common/Lossless Scaling/Lossless.dll"
allow_fp16 = true

[[profile]]
name = "app-oneway"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# REVERTED from udmabuf_ring: the ring path faults the render card.
# dmesg, boot 21:44:51, runs at ts 1234 and 1359 (all within our runs):
#   amdgpu 0000:04:00.0: WALKER_ERROR: 0x5
#   amdgpu 0000:04:00.0: MAPPING_ERROR: 0x1
#   amdgpu 0000:04:00.0: ring comp_1.1.0 timeout -> ring reset
# The copy-only VkDevice cannot read the game swapchain images, which live in
# the game device VRAM: a second device on the same card has no page-table
# mapping for them. decoupled is the verified-good path (662 presents/s).
transport = "udmabuf_ring"
ring_slots = 3
output = "DP-7"
hud = true

[[profile]]
name = "furmark-oneway"
active_in = "furmark"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# REVERTED from udmabuf_ring: the ring path faults the render card.
