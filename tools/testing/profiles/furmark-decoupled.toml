version = 2

[global]
dll = "/mnt/windows/Games/Steam/steamapps/common/Lossless Scaling/Lossless.dll"
allow_fp16 = true

[[profile]]
name = "app-oneway"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# udmabuf ring: K kernel udmabufs owned by the render side, imported as
# dma-bufs on each card, GPU DMA only, no CPU frame copy, no cross-process
# wait. K=3 from ring_slots.
transport = "udmabuf_ring"
ring_slots = 3
output = "DP-7"
hud = true

[[profile]]
name = "furmark-oneway"
active_in = "furmark"
gpu = "AMD Radeon RX 9060 XT (RADV GFX1200)"
presentation = "external"
multiplier = 2
# udmabuf ring: K kernel udmabufs owned by the render side, imported as
# dma-bufs on each card, GPU DMA only, no CPU frame copy, no cross-process
# wait. K=3 from ring_slots.
transport = "udmabuf_ring"
ring_slots = 3
output = "DP-7"
hud = true
